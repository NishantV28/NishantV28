  <text x="30" y="43" fill="#67E8F9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5">EDUCATION &amp; HIGHLIGHTS / TIMELINE</text>
  <path d="M80 257H1200" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

